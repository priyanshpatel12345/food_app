<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- main portion -->
    <main class="grid sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
      <div class="my-4 w-full">
        <div
          class="w-[90%] mx-auto h-[500px] rounded-t-xl shadow-2xl rounded-b-xl"
        >
          <img
            class="w-full h-[60%] rounded-t-xl"
            src="https://images.unsplash.com/photo-1629203851122-3726ecdf080e"
            alt=""
          />

          <div class="w-full p-6">
            <h1 class="font-medium text-2xl">Coca Cola</h1>
            <p class="text-slate-700">Cold Drink & Ice Cubes</p>

            <div class="flex relative justify-between mt-3">
              <div class="flex">
                <img
                  class="w-[40px] h-[40px] rounded-[50%] absolute left-0"
                  src="https://randomuser.me/api/portraits/men/12.jpg"
                  alt=""
                />
                <img
                  class="w-[40px] h-[40px] rounded-[50%] absolute left-7"
                  src="https://randomuser.me/api/portraits/women/25.jpg"
                  alt=""
                />
                <img
                  class="w-[40px] h-[40px] rounded-[50%] absolute left-14"
                  src="https://randomuser.me/api/portraits/men/35.jpg"
                  alt=""
                />
              </div>

              <p class="font-bold text-xl">
                <span class="text-orange-400">★</span> 4.9
              </p>
            </div>

            <button
              class="w-full h-9 mt-5 font-bold hover:text-white hover:bg-red-500 bg-white border border-solid border-red-500 text-red-500 rounded-xl"
            >
              ORDER NOW
            </button>
          </div>
        </div>
      </div>

      <!-- card-2 -->
      <div class="my-4">
        <div
          class="w-[90%] mx-auto h-[500px] rounded-t-xl shadow-2xl rounded-b-xl"
        >
          <img
            class="w-full h-[60%] rounded-t-xl"
            src="https://images.unsplash.com/photo-1581006852262-e4307cf6283a"
            alt=""
          />

          <div class="w-full p-6">
            <h1 class="font-medium text-2xl">Thums Up</h1>
            <p class="text-slate-700">Strong Taste & Chill</p>

            <div class="flex relative justify-between mt-3">
              <div class="flex">
                <img
                  class="w-[40px] h-[40px] rounded-[50%] absolute left-0"
                  src="https://randomuser.me/api/portraits/women/18.jpg"
                  alt=""
                />
                <img
                  class="w-[40px] h-[40px] rounded-[50%] absolute left-7"
                  src="https://randomuser.me/api/portraits/men/48.jpg"
                  alt=""
                />
                <img
                  class="w-[40px] h-[40px] rounded-[50%] absolute left-14"
                  src="https://randomuser.me/api/portraits/women/55.jpg"
                  alt=""
                />
              </div>

              <p class="font-bold text-xl">
                <span class="text-orange-400">★</span> 4.8
              </p>
            </div>

            <button
              class="w-full h-9 mt-5 font-bold hover:text-white hover:bg-red-500 bg-white border border-solid border-red-500 text-red-500 rounded-xl"
            >
              ORDER NOW
            </button>
          </div>
        </div>
      </div>

      <!-- card-3 -->
      <div class="my-4">
        <div
          class="w-[90%] mx-auto h-[500px] rounded-t-xl shadow-2xl rounded-b-xl"
        >
          <img
            class="w-full h-[60%] rounded-t-xl"
            src="https://images.unsplash.com/photo-1624517452488-04869289c4ca"
            alt=""
          />

          <div class="w-full p-6">
            <h1 class="font-medium text-2xl">Sprite</h1>

                />

                  class="w-[40px] h-[40px] rounded-[50%] absolute left-14"

              <p class="font-bold text-xl">
                <span class="text-orange-400">★</span> 4.7

            </div>

</html>
