<!doctype html>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <body>

    <main class="grid sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
      <div class="my-4 w-full">

          />

            <p class="text-slate-700">Cheese, Lettuce & Tomato</p>

            <div class="flex relative justify-between mt-3">
              <div class="flex">
                <img
                  class="w-[40px] h-[40px] rounded-[50%] absolute left-0"
                  src="https://randomuser.me/api/portraits/men/11.jpg"
                  alt=""
                />
                <img
                  class="w-[40px] h-[40px] rounded-[50%] absolute left-7"
                  src="https://randomuser.me/api/portraits/women/22.jpg"
                  alt=""
                />
                <img
                  class="w-[40px] h-[40px] rounded-[50%] absolute left-14"
                  src="https://randomuser.me/api/portraits/men/33.jpg"
                  alt=""
                />
              </div>

              <p class="font-bold text-xl">
                <span class="text-orange-400">★</span> 4.9

            </div>

            <button
              class="w-full h-9 mt-5 font-bold hover:text-white hover:bg-red-500 bg-white border border-solid border-red-500 text-red-500 rounded-xl"
            >
              ORDER NOW
            </button>
          </div>
        </div>
