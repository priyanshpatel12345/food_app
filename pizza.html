<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- main portion -->
    <main class="grid sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
      <div class="my-4 w-full">
        <div
          class="w-[90%] mx-auto h-[500px] rounded-t-xl shadow-2xl rounded-b-xl"
        >
          <img
            class="w-full h-[60%] rounded-t-xl"
            src="https://upload.wikimedia.org/wikipedia/commons/9/91/Pizza-3007395.jpg"
            alt=""
          />

          <div class="w-full p-6">
            <h1 class="font-medium text-2xl">Real Peprika pizza</h1>
            <p class="text-slate-700">Salmon, Rice & Avocado</p>

            <div class="flex relative justify-between mt-3">
              <div class="flex">
                <img
                  class="w-[40px] h-[40px] rounded-[50%] absolute left-0"
                  src="./pr.png"
                  alt=""
                />
                <img
                  class="w-[40px] h-[40px] rounded-[50%] absolute left-7"
                  src="https://i0.wp.com/studiolorier.com/wp-content/uploads/2018/10/Profile-Round-Sander-Lorier.jpg?ssl=1"
                  alt=""
                />
                <img
                  class="w-[40px] h-[40px] rounded-[50%] absolute left-14"
                  src="https://img.freepik.com/free-photo/confident-business-woman-portrait-smiling-face_53876-137693.jpg?semt=ais_hybrid&w=740&q=80"
                  alt=""
                />
              </div>

              <p class="font-bold text-xl">
                <span class="text-orange-400">★</span> 4.9
              </p>
            </div>

            <button
              class="w-full h-9 mt-5 font-bold hover:text-white hover:bg-red-500 bg-white border border-solid border-red-500 text-red-500 rounded-xl"
            >
              ORDER NOW
            </button>
          </div>
        </div>
      </div>
