<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Food Munch</title>
    <link
      rel="icon"
      href="https://play-lh.googleusercontent.com/ptd93uXCUh35jQrkqQkmy6E--YCwdWUYX82Aak3utxoO1csS0B3Ofx1jpI_toe0vFL1WPZjbVv_YQyE43kaCoQ"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- header start -->
    <header class="h-[55px] w-full bg-slate-100 flex justify-between">
      <div class="w-[10%] h-[55px] flex justify-center">
        <img
          class="w-[50px] h-[50px]"
          src="https://play-lh.googleusercontent.com/ptd93uXCUh35jQrkqQkmy6E--YCwdWUYX82Aak3utxoO1csS0B3Ofx1jpI_toe0vFL1WPZjbVv_YQyE43kaCoQ"
          alt="logo"
        />
      </div>
      <div class="h-[55px] w-[20%] flex items-center">
        <div class="w-[100%] h-[45px] flex items-center">
          <input
            class="w-[80%] h-[35px] rounded-s-[10px] bg-red-300 px-[10px] outline-none"
            type="search"
            placeholder="search food items"
          />
          <i
            class="fa-solid fa-magnifying-glass bg-yellow-300 h-[35px] rounded-e-[10px]"
            style="
              width: 20%;
              display: flex;
              justify-content: center;
              align-items: center;
            "
          ></i>
        </div>
      </div>
      <div class="h-[55px] w-[50%]">
        <ul
          class="flex h-[55px] w-[100%] justify-evenly items-center text-xl font-medium"
        >
          <a href="">
            <li class="bg-red-400 text-white rounded-md px-10 py-[4px]">
              home
            </li></a
          >
          <a href="">
            <li class="bg-red-400 text-white rounded-md px-10 py-[4px]">
              about
            </li>
          </a>
          <a href="">
            <li class="bg-red-400 text-white rounded-md px-10 py-[4px]">
              menu
            </li>
          </a>
          <a href="" class="bg-red-400 text-white rounded-md px-10 py-[4px]">
            <li>login</li>
          </a>
        </ul>
      </div>
      <div class="w-[10%] h-[55px] flex justify-center items-center hidden">
        <i class="fa-solid fa-bars"></i>
      </div>
    </header>

    <!-- main product -->
    <main class="w-full mx-auto h-[450px]  mt-[5px]   grid  sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-2">
      <!-- text -->
      <div class=" h-fit bg-slate-600 px-[70px] py-[50px]">
        <h3 class="text-4xl sm:text-6xl  text-white">Super</h3>
        <h1 class="text-4xl sm:text-8xl  text-yellow-300 font-bold">DELICOUS</h1>
        <h5 class="text-4xl text-white ps-6 sm:ps-36">FOOD MENU</h5>
      </div>

      <!-- photo -->
      <div class="w-[] h-[300px] ">
        <img
          class="w-full sm:w-[400px] sm:h-[300px]"
          src="https://images.moneycontrol.com/static-mcnews/2023/10/pexels-zi%E2%80%99s-foodnatureart-9027521.jpg"
          alt="photo"
        />
      </div>
    </main>
  </body>
</html>
