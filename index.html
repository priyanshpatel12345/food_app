<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Food Munch</title>
    <link
      rel="icon"
      href="https://play-lh.googleusercontent.com/ptd93uXCUh35jQrkqQkmy6E--YCwdWUYX82Aak3utxoO1csS0B3Ofx1jpI_toe0vFL1WPZjbVv_YQyE43kaCoQ"
    />
    <link
      rel="stylesheet"
      href="  ://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- header start -->
    <header class="h-[55px] w-full bg-slate-100 flex justify-between">
      <div class="w-[10%] h-[55px] flex justify-center">
        <img
          class="w-[50px] h-[50px]"
          src="https://play-lh.googleusercontent.com/ptd93uXCUh35jQrkqQkmy6E--YCwdWUYX82Aak3utxoO1csS0B3Ofx1jpI_toe0vFL1WPZjbVv_YQyE43kaCoQ"
          alt="logo"
        />
      </div>
      <div class="h-[55px] w-[20%] flex items-center">
        <div class="w-[100%] h-[45px] flex items-center">
          <input
            class="w-[80%] h-[35px] rounded-s-[10px] -300 px-[10px] outline-none"
            type="search"
            placeholder="search food items"
          />
          <i
            class="fa-solid fa-magnifying-glass bg-yellow-300 h-[35px] rounded-e-[10px]"
            style="
              width: 20%;
              display: flex;
              justify-content: center;
              align-items: center;
            "
          ></i>
        </div>
      </div>
      <div class="h-[55px] w-[50%]">
        <ul
          class="flex h-[55px] w-[100%] justify-evenly items-center text-xl font-medium"
        >
          <a href="">
            <li class="bg-red-400 text-white rounded-md px-10 py-[4px]">
              home
            </li></a
          >
          <a href="">
            <li class="bg-red-400 text-white rounded-md px-10 py-[4px]">
              about
            </li>
          </a>
          <a href="">
            <li class="bg-red-400 text-white rounded-md px-10 py-[4px]">
              menu
            </li>
          </a>
          <a href="" class="bg-red-400 text-white rounded-md px-10 py-[4px]">
            <li>login</li>
          </a>
        </ul>
      </div>
      <div class="w-[10%] h-[55px] flex justify-center items-center hidden">
        <i class="fa-solid fa-bars"></i>
      </div>
    </header>

    <!-- main product -->
    <main
      class="w-full min-h-screen grid grid-cols-1 lg:grid-cols-2 bg-slate-700"
    >
      <!-- text -->
      <div
        class="flex flex-col justify-center px-6 py-10 sm:px-10 lg:px-20 text-center lg:text-left"
      >
        <h3 class="text-4xl sm:text-5xl lg:text-6xl text-white">Super</h3>

        <h1
          class="text-5xl sm:text-7xl lg:text-8xl font-bold text-yellow-300 leading-tight"
        >
          DELICIOUS
        </h1>

        <h5 class="text-2xl sm:text-4xl lg:text-5xl text-white mt-2 lg:pl-28">
          FOOD MENU
        </h5>
      </div>

      <!-- photo -->
      <div class="flex items-center justify-center p-6">
        <img
          class="w-full max-w-[500px] h-auto rounded-2xl shadow-2xl object-cover"
          src="https://images.moneycontrol.com/static-mcnews/2023/10/pexels-zi%E2%80%99s-foodnatureart-9027521.jpg"
          alt="food"
        />
      </div>
    </main>

    <!-- Food menu -->
    <section class="grid sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-4">
      <div class="my-3">
        <div class="w-[90%] h-[300px] rounded-xl shadow-2xl mx-auto p-2">
          <img
            class="w-full h-[60%] rounded-t-xl"
            src="https://png.pngtree.com/png-vector/20250513/ourmid/pngtree-bowl-of-tricolor-pasta-with-vegetables-and-basil-for-italian-food-png-image_16260167.png"
            alt=""
          />
          <h1 class="text-center font-bold text-xl my-2">Pasta menu</h1>
          <div class="flex justify-around">
            <p class="font-bold">From 99₹</p>
            <p
              class="bg-[#efefef] p-1 text-[13px] font-bold rounded rounded-lg"
            >
              4.1 ★
            </p>
          </div>
          <a href="./pasta.html">
            <button
              class="bg-slate-400 text-slate-100 w-[100%] hover:text-slate-400 hover:bg-slate-200 font-bold rounded rounded-lg py-1 mt-3 cursor-pointer"
            >
              View more
            </button>
          </a>
        </div>
      </div>

      <div class="my-3">
        <div class="w-[90%] h-[300px] rounded-xl shadow-2xl mx-auto p-2">
          <img
            class="w-full h-[60%] rounded-t-xl"
            src="https://i.pinimg.com/originals/f9/00/7f/f9007f73da46783cb255a1e621637f27.jpg?nii=t"
            alt=""
          />
          <h1 class="text-center font-bold text-xl my-2">Pizza menu</h1>
          <div class="flex justify-around">
            <p class="font-bold">From 199₹</p>
            <p
              class="bg-[#efefef] p-1 text-[13px] font-bold rounded rounded-lg"
            >
              4.5 ★
            </p>
          </div>
          <a href="./pizza.html"
            ><button
              class="bg-slate-400 text-slate-100 w-[100%] hover:text-slate-400 hover:bg-slate-200 font-bold rounded rounded-lg py-1 mt-3 cursor-pointer"
            >
              View more
            </button></a
          >
        </div>
      </div>

      <div class="my-3">
        <div class="w-[90%] h-[300px] rounded-xl mx-auto p-2 shadow-2xl">
          <img
            class="w-full h-[60%] rounded-t-xl"
            src="https://media.istockphoto.com/id/2061716709/photo/grilled-rib-burger.jpg?s=612x612&w=0&k=20&c=QS37W9zjBE3GoOeR8ay3k_DS7oXPH07MBg-WHY5Joac="
            alt=""
          />
          <h1 class="text-center font-bold text-xl my-2">Burger menu</h1>
          <div class="flex justify-around">
            <p class="font-bold">From 149₹</p>
            <p
              class="bg-[#efefef] p-1 text-[13px] font-bold rounded rounded-lg"
            >
              4.5 ★
            </p>
          </div>
          <a href="./burger.html">
            <button
              class="bg-slate-400 text-slate-100 hover:text-slate-400 hover:bg-slate-200 w-[100%] font-bold rounded rounded-lg py-1 mt-3 cursor-pointer"
            >
              View more
            </button>
          </a>
        </div>
      </div>

      <div class="my-3">
        <div class="w-[90%] h-[300px] rounded-xl shadow-2xl mx-auto p-2">
          <img
            class="w-full h-[60%] rounded-t-xl"
            src="https://p.turbosquid.com/ts-thumb/1Q/oNNq8Z/8nY0Lt45/cocacolasoftdrink1/jpg/1323077210/1920x1080/fit_q87/907478eaabf6d55a721df6a0dbf6af858452863c/cocacolasoftdrink1.jpg"
            alt=""
          />
          <h1 class="text-center font-bold text-xl my-2">Cock menu</h1>
          <div class="flex justify-around">
            <p class="font-bold">From 99₹</p>
            <p
              class="bg-[#efefef] p-1 text-[13px] font-bold rounded rounded-lg"
            >
              4.5 ★
            </p>
          </div>
          <a href="./cock.html">
            <button
              class="bg-slate-400 text-slate-100 hover:text-slate-400 hover:bg-slate-200 w-[100%] font-bold rounded rounded-lg py-1 mt-3 cursor-pointer"
            >
              View more
            </button>
          </a>
        </div>
      </div>
    </section>
  </body>
</html>
